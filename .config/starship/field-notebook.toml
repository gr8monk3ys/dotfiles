# Generated by bin/rice-themes from .config/palette/templates/starship.toml
# for the field-notebook rice. Edit the template, then `bin/rice-themes render`.
# Starship prompt, replicating the repo's lean Powerlevel10k layout:
# `user@host dir git duration` on line 1, `venv ❯` on line 2.
# .config/zsh/rice.zsh points STARSHIP_CONFIG here when this is the rice
# (Monochrome 43 keeps its own powerline prompt, starship.toml).
"$schema" = 'https://starship.rs/config-schema.json'

# Blank line between prompts, like POWERLEVEL9K_PROMPT_ADD_NEWLINE.
add_newline = true

format = """
$username$hostname$directory$git_branch$git_status$cmd_duration
$python$character"""

# user@host only over SSH or as root, matching p10k's lean context segment.
[username]
format = '[$user]($style)[@](fg:#767c87)'
style_user = '#e3b25e'
style_root = 'bold #e87c7c'

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = '#e3b25e'

[directory]
style = '#7aa0e6'
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = '[$branch]($style) '
style = '#42a979'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = '#e3b25e'

# Show duration of commands slower than 3s (p10k's default threshold).
[cmd_duration]
min_time = 3000
format = '[$duration]($style) '
style = '#e08d55'

# Active virtualenv only (no interpreter version noise), like p10k's
# virtualenv segment on line 2.
[python]
format = '[(\($virtualenv\) )]($style)'
style = '#5fb3a1'
detect_extensions = []
detect_files = []
detect_folders = []

[character]
success_symbol = '[❯](#b796c8)'
error_symbol = '[❯](#e87c7c)'
