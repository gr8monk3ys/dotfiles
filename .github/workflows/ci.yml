name: CI

permissions: read-all

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each check runs once per PR, and every job calls a make target rather than
# carrying its own recipe, so CI and `make verify` cannot drift apart:
#   Lint                 make lint (linters + validators)
#   Tests (os)           make test-setup, make test, link/unlink round-trip
#   Container (distro)   make test-docker[-arch]: the platform's real `make`,
#                        then the suite and doctor, in a clean image
#   Installer            the curl | bash entry point
#   Fresh install (os)   bare `make` on a runner with nothing preinstalled
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Pinned to the versions `make verify` is run with locally. The runner's
      # own shellcheck is older and would disagree with the local gate.
      - name: Install linters
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          npm install --global markdownlint-cli@0.49.1

      - name: make lint
        run: make lint

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: make test-setup
        run: make test-setup

      - name: make test
        env:
          TERM: xterm
        run: make test

      - name: link / unlink round-trip
        run: |
          make link
          test -L "$HOME/.zshenv"
          make unlink
          test ! -L "$HOME/.zshenv"

  # Arch (incl. Omarchy) is a supported platform, and this is the job that
  # proves it: the container runs `make` (= `make arch`: pacman -Syu, the whole
  # install/pacmanfile under STRICT_PACKAGES, link), then the suite and doctor.
  # GitHub's runners are amd64, so the linux/amd64 image is native here. The
  # Ubuntu leg runs the generic-Linux path (`make` = link only).
  container:
    name: Container (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            target: test-docker
          - distro: arch
            target: test-docker-arch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}

  installer:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - name: curl | bash, non-interactive
        env:
          DOTFILES_ASSUME_YES: "1"
          DOTFILES_MACHINE_TYPE: "personal"
          DOTFILES_DIR: "${{ github.workspace }}/.dotfiles-install-test"
          DOTFILES_BRANCH: "${{ github.head_ref || github.ref_name }}"
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | bash
          test -L "$HOME/.zshenv"
          test -L "$HOME/.config/starship"

  # Bare `make` on a runner. On macOS that is the full fresh-machine install:
  # Homebrew bootstrap, every formula and day-one cask, npm globals, rustup +
  # crates, link, a real zsh boot, doctor. On ubuntu-latest `make` resolves to
  # the generic `linux` target, which only links; Ubuntu is not a supported
  # platform, and the Arch full install is Container (arch).
  install:
    name: Fresh install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - name: Strip the runner's preinstalled Homebrew (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew list --formula | xargs brew uninstall --ignore-dependencies --force
          brew uninstall --cask --force firefox google-chrome
          brew cleanup --prune-prefix
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/uninstall.sh)"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: make (full install for this OS)
        # Strict here on purpose: the fresh-install matrix is the one place a
        # broken manifest must fail. Bare `make` is tolerant, so before this
        # a `brew bundle` failure was swallowed by `|| true` and CI stayed green.
        # No sudo wrapper: links must land in the runner user's HOME;
        # stow-linux escalates on its own for apt/dnf.
        env:
          STRICT_PACKAGES: "1"
        run: make

      - name: Boot the shell for real
        run: |
          command -v zsh >/dev/null || sudo apt-get install -y zsh
          export TERM=xterm   # runners have no TERM; compinit/zinit need one
          test -L "$HOME/.zshenv"
          zsh -ic 'exit' || true   # first boot bootstraps zinit (network); tolerate its status
          zsh -ic 'exit'           # second boot is the real check
          zsh -ic 'test "$ZDOTDIR" = "$HOME/.config/zsh" && alias g | grep -q git && print "completions: ${#_comps}"'

      - name: make doctor
        run: make doctor
