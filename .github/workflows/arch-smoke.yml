permissions: read-all

name: Arch Linux Smoke

on:
  schedule:
    - cron: "0 15 * * 1" # Every Monday 15:00 UTC
  workflow_dispatch:

jobs:
  arch-smoke:
    name: Arch Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build Arch test image
        run: docker build -t dotfiles-test-arch -f test/Dockerfile.arch .

      - name: Run Arch smoke test
        run: docker run --rm dotfiles-test-arch
