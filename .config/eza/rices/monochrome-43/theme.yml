# Generated by bin/rice-themes from .config/palette/templates/eza-theme.yml
# for the monochrome-43 rice. Edit the template, then `bin/rice-themes render`.
# Based on Atom's One Dark color scheme
# https://github.com/eza-community/eza-themes

# File types
filetype:
  normal:
    foreground: "#e6eaf2"
  directory:
    foreground: "#7aa2f7"
    bold: true
  symlink:
    foreground: "#8b93a7"
  executable:
    foreground: "#c2c2c2"
    bold: true
  pipe:
    foreground: "#f7768e"
  socket:
    foreground: "#ffffff"
  block_device:
    foreground: "#f7768e"
  char_device:
    foreground: "#f7768e"
  special:
    foreground: "#f7768e"

# Permissions
permissions:
  user_read:
    foreground: "#c2c2c2"
  user_write:
    foreground: "#f7768e"
  user_execute_file:
    foreground: "#ff003c"
  user_execute_other:
    foreground: "#ff003c"
  group_read:
    foreground: "#c2c2c2"
  group_write:
    foreground: "#f7768e"
  group_execute:
    foreground: "#ff003c"
  other_read:
    foreground: "#c2c2c2"
  other_write:
    foreground: "#f7768e"
  other_execute:
    foreground: "#ff003c"
  special_user_file:
    foreground: "#ffffff"
  special_other:
    foreground: "#ffffff"
  attribute:
    foreground: "#6f6f6f"

# File sizes
size:
  number:
    foreground: "#c2c2c2"
  unit:
    foreground: "#8b93a7"
  major:
    foreground: "#c2c2c2"
  minor:
    foreground: "#8b93a7"

# Owners
users:
  user_you:
    foreground: "#f7768e"
    bold: true
  user_other:
    foreground: "#e6eaf2"
  group_yours:
    foreground: "#ffffff"
  group_other:
    foreground: "#6f6f6f"

# Date/time
date:
  hour_old:
    foreground: "#c2c2c2"
  day_old:
    foreground: "#7aa2f7"
  older:
    foreground: "#6f6f6f"

# Git status
git:
  new:
    foreground: "#c2c2c2"
    bold: true
  modified:
    foreground: "#f7768e"
  deleted:
    foreground: "#ff003c"
  renamed:
    foreground: "#ffffff"
  ignored:
    foreground: "#6f6f6f"
  conflicted:
    foreground: "#ff003c"
    bold: true

# Links
links:
  normal:
    foreground: "#ffffff"
  multi:
    foreground: "#8b93a7"

# Punctuation
punctuation:
  foreground: "#6f6f6f"

# Control characters
control:
  foreground: "#ff003c"

# Broken symlinks
broken_symlink:
  foreground: "#ff003c"
  bold: true

# Git repo header
git_repo:
  branch:
    foreground: "#ffffff"
    bold: true
  clean:
    foreground: "#c2c2c2"
  dirty:
    foreground: "#f7768e"
