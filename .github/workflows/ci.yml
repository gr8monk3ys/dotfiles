name: CI

permissions: read-all

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: ShellCheck bin/
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: ./bin
          severity: warning

      - name: markdownlint
        uses: articulate/actions-markdownlint@17b8abe7407cd17590c006ecc837c35e1ac3ed83
        with:
          config: .markdownlint.json
          files: "**/*.md"
          ignore: |
            .github
            test

      - name: Validators (doc links, tool catalog, stale refs)
        run: make verify-doc-links verify-tool-docs verify-stale-refs

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bats-core
          brew tap bats-core/bats-core
          brew trust bats-core/bats-core 2>/dev/null || true
          brew install bats-support bats-assert stow

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats zsh stow
          sudo mkdir -p /usr/lib/bats
          sudo git clone --depth 1 https://github.com/bats-core/bats-support.git /usr/lib/bats/bats-support
          sudo git clone --depth 1 https://github.com/bats-core/bats-assert.git /usr/lib/bats/bats-assert

      - name: make verify (no Docker)
        env:
          SKIP_DOCKER: "1"
          TERM: xterm
        run: make verify

      - name: link / unlink round-trip
        run: |
          make link
          test -L "$HOME/.zshenv"
          make unlink
          test ! -L "$HOME/.zshenv"

  installer:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - name: curl | bash, non-interactive
        env:
          DOTFILES_ASSUME_YES: "1"
          DOTFILES_MACHINE_TYPE: "personal"
          DOTFILES_DIR: "${{ github.workspace }}/.dotfiles-install-test"
          DOTFILES_BRANCH: "${{ github.head_ref || github.ref_name }}"
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | bash
          test -L "$HOME/.zshenv"
          test -L "$HOME/.config/starship"

  # Full fresh-machine install: Homebrew bootstrap, every formula and day-one
  # cask, npm globals, rustup + crates, link, real zsh boot, doctor. This is
  # the only check that proves `make` works on a machine that has nothing.
  install:
    name: Fresh install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, ubuntu-latest]
    steps:
      - name: Strip the runner's preinstalled Homebrew (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew uninstall --ignore-dependencies --force $(brew list --formula)
          brew uninstall --cask --force firefox google-chrome
          brew cleanup --prune-prefix
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/uninstall.sh)"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: make (full install for this OS)
        # No sudo wrapper: links must land in the runner user's HOME;
        # stow-linux escalates on its own for apt/dnf.
        run: make

      - name: Boot the shell for real
        run: |
          command -v zsh >/dev/null || sudo apt-get install -y zsh
          export TERM=xterm   # runners have no TERM; compinit/zinit need one
          test -L "$HOME/.zshenv"
          zsh -ic 'exit' || true   # first boot bootstraps zinit (network); tolerate its status
          zsh -ic 'exit'           # second boot is the real check
          zsh -ic 'test "$ZDOTDIR" = "$HOME/.config/zsh" && alias g | grep -q git && print "completions: ${#_comps}"'

      - name: make doctor
        run: make doctor
