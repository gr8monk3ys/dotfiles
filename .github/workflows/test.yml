permissions: read-all

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: BATS Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install BATS and libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bats-core
          brew tap bats-core/bats-core
          brew install bats-support bats-assert

      - name: Install BATS and libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          # Install bats-support and bats-assert
          sudo mkdir -p /usr/lib/bats
          sudo git clone https://github.com/bats-core/bats-support.git /usr/lib/bats/bats-support
          sudo git clone https://github.com/bats-core/bats-assert.git /usr/lib/bats/bats-assert

      - name: Run test suite
        run: make test

  integration:
    name: Integration Tests
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install stow
        run: brew install stow

      - name: Test symlink creation
        run: |
          make link
          test -L "$HOME/.zshenv"
          test -d "$HOME/.config"

      - name: Test symlink removal
        run: |
          make unlink
          test ! -L "$HOME/.zshenv"

      - name: Test clean target
        run: make clean

  nix-check:
    name: Nix Flake Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Nix
        uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check --no-build

      - name: Show flake info
        run: nix flake show
