# Yazi Theme Configuration - OneDark
# https://yazi-rs.github.io/docs/configuration/theme
# Consistent with Neovim, bat, eza, git-delta, and zellij

[manager]
# Active file/directory
cwd = { fg = "#61afef" }

# Hovered item
hovered         = { fg = "#282c34", bg = "#61afef", bold = true }
preview_hovered = { underline = true }

# Selection markers
find_keyword  = { fg = "#e5c07b", bold = true, italic = true, underline = true }
find_position = { fg = "#c678dd", bg = "reset", bold = true, italic = true }

# Markers
marker_copied   = { fg = "#98c379", bg = "#98c379" }
marker_cut      = { fg = "#e06c75", bg = "#e06c75" }
marker_marked   = { fg = "#56b6c2", bg = "#56b6c2" }
marker_selected = { fg = "#e5c07b", bg = "#e5c07b" }

# Tabs
tab_active   = { fg = "#282c34", bg = "#61afef" }
tab_inactive = { fg = "#abb2bf", bg = "#3e4451" }
tab_width    = 1

# Count indicators
count_copied   = { fg = "#282c34", bg = "#98c379" }
count_cut      = { fg = "#282c34", bg = "#e06c75" }
count_selected = { fg = "#282c34", bg = "#e5c07b" }

# Borders
border_symbol = "│"
border_style  = { fg = "#5c6370" }

# Highlighting
[manager.highlighting]
# File types use OneDark palette
directory = { fg = "#61afef", bold = true }
symlink   = { fg = "#56b6c2", italic = true }
orphan    = { fg = "#e06c75", italic = true }
executable = { fg = "#98c379", bold = true }
hidden     = { fg = "#5c6370" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#3e4451", bg = "#3e4451" }

# Mode
mode_normal = { fg = "#282c34", bg = "#61afef", bold = true }
mode_select = { fg = "#282c34", bg = "#98c379", bold = true }
mode_unset  = { fg = "#282c34", bg = "#c678dd", bold = true }

# Progress
progress_label  = { fg = "#abb2bf", bold = true }
progress_normal = { fg = "#61afef", bg = "#3e4451" }
progress_error  = { fg = "#e06c75", bg = "#3e4451" }

# Permissions
permissions_t = { fg = "#61afef" }
permissions_r = { fg = "#e5c07b" }
permissions_w = { fg = "#e06c75" }
permissions_x = { fg = "#98c379" }
permissions_s = { fg = "#5c6370" }

[input]
border   = { fg = "#61afef" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#61afef" }
active   = { fg = "#c678dd", bold = true }
inactive = {}

[tasks]
border  = { fg = "#61afef" }
title   = {}
hovered = { fg = "#c678dd", underline = true }

[which]
cols            = 3
mask            = { bg = "#282c34" }
cand            = { fg = "#56b6c2" }
rest            = { fg = "#5c6370" }
desc            = { fg = "#c678dd" }
separator       = "  "
separator_style = { fg = "#5c6370" }

[help]
on      = { fg = "#56b6c2" }
run     = { fg = "#c678dd" }
desc    = { fg = "#abb2bf" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#5c6370", bg = "#282c34" }

[notify]
title_info  = { fg = "#98c379" }
title_warn  = { fg = "#e5c07b" }
title_error = { fg = "#e06c75" }

# Icons (requires Nerd Font)
[icon]
# These are built-in but you can customize

[filetype]
rules = [
    # Directories
    { name = ".git",          text = "", fg = "#e06c75" },
    { name = ".github",       text = "", fg = "#abb2bf" },
    { name = "node_modules",  text = "", fg = "#98c379" },
    { name = ".config",       text = "", fg = "#61afef" },
    { name = "src",           text = "", fg = "#e5c07b" },
    { name = "test",          text = "", fg = "#c678dd" },
    { name = "tests",         text = "", fg = "#c678dd" },

    # Common files
    { name = "Makefile",      text = "", fg = "#6d8086" },
    { name = "Dockerfile",    text = "󰡨", fg = "#61afef" },
    { name = ".dockerignore", text = "󰡨", fg = "#5c6370" },
    { name = ".gitignore",    text = "", fg = "#e06c75" },
    { name = ".gitmodules",   text = "", fg = "#e06c75" },
    { name = "LICENSE",       text = "", fg = "#e5c07b" },
    { name = "README.md",     text = "", fg = "#61afef" },

    # Extensions - Languages
    { name = "*.rs",      text = "", fg = "#e06c75" },
    { name = "*.go",      text = "", fg = "#56b6c2" },
    { name = "*.py",      text = "", fg = "#e5c07b" },
    { name = "*.js",      text = "", fg = "#e5c07b" },
    { name = "*.ts",      text = "", fg = "#61afef" },
    { name = "*.tsx",     text = "", fg = "#61afef" },
    { name = "*.jsx",     text = "", fg = "#61afef" },
    { name = "*.lua",     text = "", fg = "#61afef" },
    { name = "*.rb",      text = "", fg = "#e06c75" },
    { name = "*.zig",     text = "", fg = "#e5c07b" },
    { name = "*.nix",     text = "", fg = "#61afef" },
    { name = "*.sh",      text = "", fg = "#98c379" },
    { name = "*.zsh",     text = "", fg = "#98c379" },
    { name = "*.bash",    text = "", fg = "#98c379" },
    { name = "*.fish",    text = "", fg = "#98c379" },

    # Config files
    { name = "*.toml",    text = "", fg = "#5c6370" },
    { name = "*.yaml",    text = "", fg = "#5c6370" },
    { name = "*.yml",     text = "", fg = "#5c6370" },
    { name = "*.json",    text = "", fg = "#e5c07b" },
    { name = "*.xml",     text = "󰗀", fg = "#e06c75" },
    { name = "*.conf",    text = "", fg = "#5c6370" },
    { name = "*.ini",     text = "", fg = "#5c6370" },

    # Documents
    { name = "*.md",      text = "", fg = "#abb2bf" },
    { name = "*.pdf",     text = "", fg = "#e06c75" },
    { name = "*.tex",     text = "", fg = "#98c379" },
    { name = "*.typ",     text = "", fg = "#56b6c2" },

    # Media
    { name = "*.png",     text = "", fg = "#c678dd" },
    { name = "*.jpg",     text = "", fg = "#c678dd" },
    { name = "*.jpeg",    text = "", fg = "#c678dd" },
    { name = "*.gif",     text = "", fg = "#c678dd" },
    { name = "*.svg",     text = "", fg = "#c678dd" },
    { name = "*.webp",    text = "", fg = "#c678dd" },
    { name = "*.mp4",     text = "", fg = "#c678dd" },
    { name = "*.mkv",     text = "", fg = "#c678dd" },
    { name = "*.mp3",     text = "", fg = "#56b6c2" },
    { name = "*.flac",    text = "", fg = "#56b6c2" },

    # Archives
    { name = "*.zip",     text = "", fg = "#e5c07b" },
    { name = "*.tar",     text = "", fg = "#e5c07b" },
    { name = "*.gz",      text = "", fg = "#e5c07b" },
    { name = "*.7z",      text = "", fg = "#e5c07b" },
    { name = "*.rar",     text = "", fg = "#e5c07b" },

    # Lock files
    { name = "*.lock",    text = "", fg = "#5c6370" },
]
