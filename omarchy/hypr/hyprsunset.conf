# gamma 0.75: monitor backlight is pinned at 100 (ddcutil vcp 10) to stop coil whine; dimming happens here instead.
# Daytime: no tint.
profile {
    time = 07:00
    identity = true
    gamma = 0.75
}

# Evening: warm, like reading the notebook under a desk lamp.
profile {
    time = 20:30
    temperature = 4200
    gamma = 0.75
}

# Late night: warmer still.
profile {
    time = 23:30
    temperature = 3400
    gamma = 0.75
}
