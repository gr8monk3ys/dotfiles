# Generated by bin/rice-themes from .config/palette/templates/eza-theme.yml
# for the field-notebook rice. Edit the template, then `bin/rice-themes render`.
# Based on Atom's One Dark color scheme
# https://github.com/eza-community/eza-themes

# File types
filetype:
  normal:
    foreground: "#eceef1"
  directory:
    foreground: "#7aa0e6"
    bold: true
  symlink:
    foreground: "#5fb3a1"
  executable:
    foreground: "#42a979"
    bold: true
  pipe:
    foreground: "#e3b25e"
  socket:
    foreground: "#b796c8"
  block_device:
    foreground: "#e3b25e"
  char_device:
    foreground: "#e3b25e"
  special:
    foreground: "#e08d55"

# Permissions
permissions:
  user_read:
    foreground: "#42a979"
  user_write:
    foreground: "#e3b25e"
  user_execute_file:
    foreground: "#e87c7c"
  user_execute_other:
    foreground: "#e87c7c"
  group_read:
    foreground: "#42a979"
  group_write:
    foreground: "#e3b25e"
  group_execute:
    foreground: "#e87c7c"
  other_read:
    foreground: "#42a979"
  other_write:
    foreground: "#e3b25e"
  other_execute:
    foreground: "#e87c7c"
  special_user_file:
    foreground: "#b796c8"
  special_other:
    foreground: "#b796c8"
  attribute:
    foreground: "#767c87"

# File sizes
size:
  number:
    foreground: "#42a979"
  unit:
    foreground: "#5fb3a1"
  major:
    foreground: "#42a979"
  minor:
    foreground: "#5fb3a1"

# Owners
users:
  user_you:
    foreground: "#e3b25e"
    bold: true
  user_other:
    foreground: "#eceef1"
  group_yours:
    foreground: "#b796c8"
  group_other:
    foreground: "#767c87"

# Date/time
date:
  hour_old:
    foreground: "#42a979"
  day_old:
    foreground: "#7aa0e6"
  older:
    foreground: "#767c87"

# Git status
git:
  new:
    foreground: "#42a979"
    bold: true
  modified:
    foreground: "#e3b25e"
  deleted:
    foreground: "#e87c7c"
  renamed:
    foreground: "#b796c8"
  ignored:
    foreground: "#767c87"
  conflicted:
    foreground: "#e87c7c"
    bold: true

# Links
links:
  normal:
    foreground: "#b796c8"
  multi:
    foreground: "#5fb3a1"

# Punctuation
punctuation:
  foreground: "#767c87"

# Control characters
control:
  foreground: "#e87c7c"

# Broken symlinks
broken_symlink:
  foreground: "#e87c7c"
  bold: true

# Git repo header
git_repo:
  branch:
    foreground: "#b796c8"
    bold: true
  clean:
    foreground: "#42a979"
  dirty:
    foreground: "#e3b25e"
