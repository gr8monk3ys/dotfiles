# eza OneDark Theme
# Based on Atom's One Dark color scheme
# https://github.com/eza-community/eza-themes

# OneDark Color Palette:
# Background:  #282c34
# Foreground:  #abb2bf
# Red:         #e06c75
# Green:       #98c379
# Yellow:      #e5c07b
# Blue:        #61afef
# Magenta:     #c678dd
# Cyan:        #56b6c2
# Orange:      #d19a66
# Comment:     #5c6370

# File types
filetype:
  normal:
    foreground: "#abb2bf"
  directory:
    foreground: "#61afef"
    bold: true
  symlink:
    foreground: "#56b6c2"
  executable:
    foreground: "#98c379"
    bold: true
  pipe:
    foreground: "#e5c07b"
  socket:
    foreground: "#c678dd"
  block_device:
    foreground: "#e5c07b"
  char_device:
    foreground: "#e5c07b"
  special:
    foreground: "#d19a66"

# Permissions
permissions:
  user_read:
    foreground: "#98c379"
  user_write:
    foreground: "#e5c07b"
  user_execute_file:
    foreground: "#e06c75"
  user_execute_other:
    foreground: "#e06c75"
  group_read:
    foreground: "#98c379"
  group_write:
    foreground: "#e5c07b"
  group_execute:
    foreground: "#e06c75"
  other_read:
    foreground: "#98c379"
  other_write:
    foreground: "#e5c07b"
  other_execute:
    foreground: "#e06c75"
  special_user_file:
    foreground: "#c678dd"
  special_other:
    foreground: "#c678dd"
  attribute:
    foreground: "#5c6370"

# File sizes
size:
  number:
    foreground: "#98c379"
  unit:
    foreground: "#56b6c2"
  major:
    foreground: "#98c379"
  minor:
    foreground: "#56b6c2"

# Owners
users:
  user_you:
    foreground: "#e5c07b"
    bold: true
  user_other:
    foreground: "#abb2bf"
  group_yours:
    foreground: "#c678dd"
  group_other:
    foreground: "#5c6370"

# Date/time
date:
  hour_old:
    foreground: "#98c379"
  day_old:
    foreground: "#61afef"
  older:
    foreground: "#5c6370"

# Git status
git:
  new:
    foreground: "#98c379"
    bold: true
  modified:
    foreground: "#e5c07b"
  deleted:
    foreground: "#e06c75"
  renamed:
    foreground: "#c678dd"
  ignored:
    foreground: "#5c6370"
  conflicted:
    foreground: "#e06c75"
    bold: true

# Links
links:
  normal:
    foreground: "#c678dd"
  multi:
    foreground: "#56b6c2"

# Punctuation
punctuation:
  foreground: "#5c6370"

# Control characters
control:
  foreground: "#e06c75"

# Broken symlinks
broken_symlink:
  foreground: "#e06c75"
  bold: true

# Git repo header
git_repo:
  branch:
    foreground: "#c678dd"
    bold: true
  clean:
    foreground: "#98c379"
  dirty:
    foreground: "#e5c07b"
