permissions: read-all

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: BATS Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install BATS and libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bats-core
          brew tap bats-core/bats-core
          brew trust bats-core/bats-core 2>/dev/null || true   # Homebrew >= 5 tap-trust gate
          brew install bats-support bats-assert

      - name: Install BATS and libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats zsh
          # Install bats-support and bats-assert
          sudo mkdir -p /usr/lib/bats
          sudo git clone https://github.com/bats-core/bats-support.git /usr/lib/bats/bats-support
          sudo git clone https://github.com/bats-core/bats-assert.git /usr/lib/bats/bats-assert

      - name: Run test suite
        run: make test

  integration:
    name: Integration Tests
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install stow
        run: brew install stow

      - name: Test symlink creation
        run: |
          make link
          test -L "$HOME/.zshenv"
          test -d "$HOME/.config"

      - name: Test symlink removal
        run: |
          make unlink
          test ! -L "$HOME/.zshenv"

      - name: Test clean target
        run: make clean

