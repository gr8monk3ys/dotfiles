# danse - the palette every themed tool in this checkout draws from.
#
# Structure is OneDark. Two accents and two chrome fills are tuned to Henri
# Matisse, "La Danse" (1910, Hermitage), which is also the desktop background
# (see bin/wallpaper). The painting's three fields were sampled directly:
#
#     ultramarine sky     #274063  #31486d  #243958
#     vermilion figures   #b34931  #b43e29
#     viridian ground     #476a62
#
# The sampled values are too dark for terminal text, so the two accent roles
# take the painting's *hue* at OneDark's luminance; the two fill roles take
# the sampled colour as-is and are used only for chrome.
#
# Format: name|hex|role. Read with bin/palette; never re-typed by hand.
# Retiring a colour means adding its old hex to verify-stale-refs in the
# Makefile, so a copy left behind in some other config fails the build.

bg|#282c34|base ground - sketchybar, zellij, yazi
bg-dark|#21252b|terminal ground - ghostty
surface|#3e4451|raised surface, selection, inactive border
fg|#abb2bf|primary text
comment|#5c6370|dim text, subtext, overlay
blue|#61afef|primary accent - directories, focus, prompt
cyan|#56b6c2|secondary accent - links, symlinks
green|#98c379|success, clean git state
yellow|#e5c07b|warning, dirty git state
magenta|#c678dd|special accent
vermilion|#e06a51|error - Matisse figure red, brightened to OneDark luminance
terracotta|#d98c5c|numbers and constants - Matisse figure red, mid tone
ultramarine|#2b4468|chrome fill only - Matisse sky. Too dark for text.
viridian|#476a62|chrome fill only - Matisse ground. Too dark for text.
