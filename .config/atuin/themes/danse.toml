# danse theme for Atuin's search UI (OneDark retuned to Matisse).
# Hexes come from .config/palette/danse.conf.
[theme]
name = "danse"

[colors]
Base = "#abb2bf"
Title = "#61afef"
Annotation = "#56b6c2"
Guidance = "#5c6370"
Important = "#c678dd"
AlertInfo = "#98c379"
AlertWarn = "#e5c07b"
AlertError = "#e06a51"
