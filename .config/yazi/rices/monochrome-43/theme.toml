# Generated by bin/rice-themes from .config/palette/templates/yazi-theme.toml
# for the monochrome-43 rice. Edit the template, then `bin/rice-themes render`.
# Yazi theme, selected with YAZI_CONFIG_HOME by .config/zsh/rice.zsh.
# https://yazi-rs.github.io/docs/configuration/theme
# Consistent with Neovim, bat, eza, git-delta, and zellij

[mgr]
# Active file/directory
cwd = { fg = "#7aa2f7" }

# Hovered item
hovered         = { fg = "#000000", bg = "#7aa2f7", bold = true }
preview_hovered = { underline = true }

# Selection markers
find_keyword  = { fg = "#f7768e", bold = true, italic = true, underline = true }
find_position = { fg = "#ffffff", bg = "reset", bold = true, italic = true }

# Markers
marker_copied   = { fg = "#c2c2c2", bg = "#c2c2c2" }
marker_cut      = { fg = "#ff003c", bg = "#ff003c" }
marker_marked   = { fg = "#8b93a7", bg = "#8b93a7" }
marker_selected = { fg = "#f7768e", bg = "#f7768e" }

# Tabs
tab_active   = { fg = "#000000", bg = "#7aa2f7" }
tab_inactive = { fg = "#e6eaf2", bg = "#2a2a2a" }
tab_width    = 1

# Count indicators
count_copied   = { fg = "#000000", bg = "#c2c2c2" }
count_cut      = { fg = "#000000", bg = "#ff003c" }
count_selected = { fg = "#000000", bg = "#f7768e" }

# Borders
border_symbol = "│"
border_style  = { fg = "#6f6f6f" }

# Highlighting
[mgr.highlighting]
directory = { fg = "#7aa2f7", bold = true }
symlink   = { fg = "#8b93a7", italic = true }
orphan    = { fg = "#ff003c", italic = true }
executable = { fg = "#c2c2c2", bold = true }
hidden     = { fg = "#6f6f6f" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#2a2a2a", bg = "#2a2a2a" }

# Mode
mode_normal = { fg = "#000000", bg = "#7aa2f7", bold = true }
mode_select = { fg = "#000000", bg = "#c2c2c2", bold = true }
mode_unset  = { fg = "#000000", bg = "#ffffff", bold = true }

# Progress
progress_label  = { fg = "#e6eaf2", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#2a2a2a" }
progress_error  = { fg = "#ff003c", bg = "#2a2a2a" }

# Permissions
permissions_t = { fg = "#7aa2f7" }
permissions_r = { fg = "#f7768e" }
permissions_w = { fg = "#ff003c" }
permissions_x = { fg = "#c2c2c2" }
permissions_s = { fg = "#6f6f6f" }

[input]
border   = { fg = "#7aa2f7" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#7aa2f7" }
active   = { fg = "#ffffff", bold = true }
inactive = {}

[tasks]
border  = { fg = "#7aa2f7" }
title   = {}
hovered = { fg = "#ffffff", underline = true }

[which]
cols            = 3
mask            = { bg = "#000000" }
cand            = { fg = "#8b93a7" }
rest            = { fg = "#6f6f6f" }
desc            = { fg = "#ffffff" }
separator       = "  "
separator_style = { fg = "#6f6f6f" }

[help]
on      = { fg = "#8b93a7" }
run     = { fg = "#ffffff" }
desc    = { fg = "#e6eaf2" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#6f6f6f", bg = "#000000" }

[notify]
title_info  = { fg = "#c2c2c2" }
title_warn  = { fg = "#f7768e" }
title_error = { fg = "#ff003c" }

# Icons (requires Nerd Font)
[icon]
# These are built-in but you can customize

[filetype]
rules = [
    # Directories
    { name = ".git",          text = "", fg = "#ff003c" },
    { name = ".github",       text = "", fg = "#e6eaf2" },
    { name = "node_modules",  text = "", fg = "#c2c2c2" },
    { name = ".config",       text = "", fg = "#7aa2f7" },
    { name = "src",           text = "", fg = "#f7768e" },
    { name = "test",          text = "", fg = "#ffffff" },
    { name = "tests",         text = "", fg = "#ffffff" },

    # Common files
    { name = "Makefile",      text = "", fg = "#6f6f6f" },
    { name = "Dockerfile",    text = "󰡨", fg = "#7aa2f7" },
    { name = ".dockerignore", text = "󰡨", fg = "#6f6f6f" },
    { name = ".gitignore",    text = "", fg = "#ff003c" },
    { name = ".gitmodules",   text = "", fg = "#ff003c" },
    { name = "LICENSE",       text = "", fg = "#f7768e" },
    { name = "README.md",     text = "", fg = "#7aa2f7" },

    # Extensions - Languages
    { name = "*.rs",      text = "", fg = "#ff003c" },
    { name = "*.go",      text = "", fg = "#8b93a7" },
    { name = "*.py",      text = "", fg = "#f7768e" },
    { name = "*.js",      text = "", fg = "#f7768e" },
    { name = "*.ts",      text = "", fg = "#7aa2f7" },
    { name = "*.tsx",     text = "", fg = "#7aa2f7" },
    { name = "*.jsx",     text = "", fg = "#7aa2f7" },
    { name = "*.lua",     text = "", fg = "#7aa2f7" },
    { name = "*.rb",      text = "", fg = "#ff003c" },
    { name = "*.zig",     text = "", fg = "#f7768e" },
    { name = "*.nix",     text = "", fg = "#7aa2f7" },
    { name = "*.sh",      text = "", fg = "#c2c2c2" },
    { name = "*.zsh",     text = "", fg = "#c2c2c2" },
    { name = "*.bash",    text = "", fg = "#c2c2c2" },
    { name = "*.fish",    text = "", fg = "#c2c2c2" },

    # Config files
    { name = "*.toml",    text = "", fg = "#6f6f6f" },
    { name = "*.yaml",    text = "", fg = "#6f6f6f" },
    { name = "*.yml",     text = "", fg = "#6f6f6f" },
    { name = "*.json",    text = "", fg = "#f7768e" },
    { name = "*.xml",     text = "󰗀", fg = "#ff003c" },
    { name = "*.conf",    text = "", fg = "#6f6f6f" },
    { name = "*.ini",     text = "", fg = "#6f6f6f" },

    # Documents
    { name = "*.md",      text = "", fg = "#e6eaf2" },
    { name = "*.pdf",     text = "", fg = "#ff003c" },
    { name = "*.tex",     text = "", fg = "#c2c2c2" },
    { name = "*.typ",     text = "", fg = "#8b93a7" },

    # Media
    { name = "*.png",     text = "", fg = "#ffffff" },
    { name = "*.jpg",     text = "", fg = "#ffffff" },
    { name = "*.jpeg",    text = "", fg = "#ffffff" },
    { name = "*.gif",     text = "", fg = "#ffffff" },
    { name = "*.svg",     text = "", fg = "#ffffff" },
    { name = "*.webp",    text = "", fg = "#ffffff" },
    { name = "*.mp4",     text = "", fg = "#ffffff" },
    { name = "*.mkv",     text = "", fg = "#ffffff" },
    { name = "*.mp3",     text = "", fg = "#8b93a7" },
    { name = "*.flac",    text = "", fg = "#8b93a7" },

    # Archives
    { name = "*.zip",     text = "", fg = "#f7768e" },
    { name = "*.tar",     text = "", fg = "#f7768e" },
    { name = "*.gz",      text = "", fg = "#f7768e" },
    { name = "*.7z",      text = "", fg = "#f7768e" },
    { name = "*.rar",     text = "", fg = "#f7768e" },

    # Lock files
    { name = "*.lock",    text = "", fg = "#6f6f6f" },
]
