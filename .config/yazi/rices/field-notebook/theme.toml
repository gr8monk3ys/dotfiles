# Generated by bin/rice-themes from .config/palette/templates/yazi-theme.toml
# for the field-notebook rice. Edit the template, then `bin/rice-themes render`.
# Yazi theme, selected with YAZI_CONFIG_HOME by .config/zsh/rice.zsh.
# https://yazi-rs.github.io/docs/configuration/theme
# Consistent with Neovim, bat, eza, git-delta, and zellij

[mgr]
# Active file/directory
cwd = { fg = "#7aa0e6" }

# Hovered item
hovered         = { fg = "#111317", bg = "#7aa0e6", bold = true }
preview_hovered = { underline = true }

# Selection markers
find_keyword  = { fg = "#e3b25e", bold = true, italic = true, underline = true }
find_position = { fg = "#b796c8", bg = "reset", bold = true, italic = true }

# Markers
marker_copied   = { fg = "#42a979", bg = "#42a979" }
marker_cut      = { fg = "#e87c7c", bg = "#e87c7c" }
marker_marked   = { fg = "#5fb3a1", bg = "#5fb3a1" }
marker_selected = { fg = "#e3b25e", bg = "#e3b25e" }

# Tabs
tab_active   = { fg = "#111317", bg = "#7aa0e6" }
tab_inactive = { fg = "#eceef1", bg = "#292c32" }
tab_width    = 1

# Count indicators
count_copied   = { fg = "#111317", bg = "#42a979" }
count_cut      = { fg = "#111317", bg = "#e87c7c" }
count_selected = { fg = "#111317", bg = "#e3b25e" }

# Borders
border_symbol = "│"
border_style  = { fg = "#767c87" }

# Highlighting
[mgr.highlighting]
directory = { fg = "#7aa0e6", bold = true }
symlink   = { fg = "#5fb3a1", italic = true }
orphan    = { fg = "#e87c7c", italic = true }
executable = { fg = "#42a979", bold = true }
hidden     = { fg = "#767c87" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#292c32", bg = "#292c32" }

# Mode
mode_normal = { fg = "#111317", bg = "#7aa0e6", bold = true }
mode_select = { fg = "#111317", bg = "#42a979", bold = true }
mode_unset  = { fg = "#111317", bg = "#b796c8", bold = true }

# Progress
progress_label  = { fg = "#eceef1", bold = true }
progress_normal = { fg = "#7aa0e6", bg = "#292c32" }
progress_error  = { fg = "#e87c7c", bg = "#292c32" }

# Permissions
permissions_t = { fg = "#7aa0e6" }
permissions_r = { fg = "#e3b25e" }
permissions_w = { fg = "#e87c7c" }
permissions_x = { fg = "#42a979" }
permissions_s = { fg = "#767c87" }

[input]
border   = { fg = "#7aa0e6" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#7aa0e6" }
active   = { fg = "#b796c8", bold = true }
inactive = {}

[tasks]
border  = { fg = "#7aa0e6" }
title   = {}
hovered = { fg = "#b796c8", underline = true }

[which]
cols            = 3
mask            = { bg = "#111317" }
cand            = { fg = "#5fb3a1" }
rest            = { fg = "#767c87" }
desc            = { fg = "#b796c8" }
separator       = "  "
separator_style = { fg = "#767c87" }

[help]
on      = { fg = "#5fb3a1" }
run     = { fg = "#b796c8" }
desc    = { fg = "#eceef1" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#767c87", bg = "#111317" }

[notify]
title_info  = { fg = "#42a979" }
title_warn  = { fg = "#e3b25e" }
title_error = { fg = "#e87c7c" }

# Icons (requires Nerd Font)
[icon]
# These are built-in but you can customize

[filetype]
rules = [
    # Directories
    { name = ".git",          text = "", fg = "#e87c7c" },
    { name = ".github",       text = "", fg = "#eceef1" },
    { name = "node_modules",  text = "", fg = "#42a979" },
    { name = ".config",       text = "", fg = "#7aa0e6" },
    { name = "src",           text = "", fg = "#e3b25e" },
    { name = "test",          text = "", fg = "#b796c8" },
    { name = "tests",         text = "", fg = "#b796c8" },

    # Common files
    { name = "Makefile",      text = "", fg = "#767c87" },
    { name = "Dockerfile",    text = "󰡨", fg = "#7aa0e6" },
    { name = ".dockerignore", text = "󰡨", fg = "#767c87" },
    { name = ".gitignore",    text = "", fg = "#e87c7c" },
    { name = ".gitmodules",   text = "", fg = "#e87c7c" },
    { name = "LICENSE",       text = "", fg = "#e3b25e" },
    { name = "README.md",     text = "", fg = "#7aa0e6" },

    # Extensions - Languages
    { name = "*.rs",      text = "", fg = "#e87c7c" },
    { name = "*.go",      text = "", fg = "#5fb3a1" },
    { name = "*.py",      text = "", fg = "#e3b25e" },
    { name = "*.js",      text = "", fg = "#e3b25e" },
    { name = "*.ts",      text = "", fg = "#7aa0e6" },
    { name = "*.tsx",     text = "", fg = "#7aa0e6" },
    { name = "*.jsx",     text = "", fg = "#7aa0e6" },
    { name = "*.lua",     text = "", fg = "#7aa0e6" },
    { name = "*.rb",      text = "", fg = "#e87c7c" },
    { name = "*.zig",     text = "", fg = "#e3b25e" },
    { name = "*.nix",     text = "", fg = "#7aa0e6" },
    { name = "*.sh",      text = "", fg = "#42a979" },
    { name = "*.zsh",     text = "", fg = "#42a979" },
    { name = "*.bash",    text = "", fg = "#42a979" },
    { name = "*.fish",    text = "", fg = "#42a979" },

    # Config files
    { name = "*.toml",    text = "", fg = "#767c87" },
    { name = "*.yaml",    text = "", fg = "#767c87" },
    { name = "*.yml",     text = "", fg = "#767c87" },
    { name = "*.json",    text = "", fg = "#e3b25e" },
    { name = "*.xml",     text = "󰗀", fg = "#e87c7c" },
    { name = "*.conf",    text = "", fg = "#767c87" },
    { name = "*.ini",     text = "", fg = "#767c87" },

    # Documents
    { name = "*.md",      text = "", fg = "#eceef1" },
    { name = "*.pdf",     text = "", fg = "#e87c7c" },
    { name = "*.tex",     text = "", fg = "#42a979" },
    { name = "*.typ",     text = "", fg = "#5fb3a1" },

    # Media
    { name = "*.png",     text = "", fg = "#b796c8" },
    { name = "*.jpg",     text = "", fg = "#b796c8" },
    { name = "*.jpeg",    text = "", fg = "#b796c8" },
    { name = "*.gif",     text = "", fg = "#b796c8" },
    { name = "*.svg",     text = "", fg = "#b796c8" },
    { name = "*.webp",    text = "", fg = "#b796c8" },
    { name = "*.mp4",     text = "", fg = "#b796c8" },
    { name = "*.mkv",     text = "", fg = "#b796c8" },
    { name = "*.mp3",     text = "", fg = "#5fb3a1" },
    { name = "*.flac",    text = "", fg = "#5fb3a1" },

    # Archives
    { name = "*.zip",     text = "", fg = "#e3b25e" },
    { name = "*.tar",     text = "", fg = "#e3b25e" },
    { name = "*.gz",      text = "", fg = "#e3b25e" },
    { name = "*.7z",      text = "", fg = "#e3b25e" },
    { name = "*.rar",     text = "", fg = "#e3b25e" },

    # Lock files
    { name = "*.lock",    text = "", fg = "#767c87" },
]
