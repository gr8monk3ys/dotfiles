# Yazi Keymap Configuration
# https://yazi-rs.github.io/docs/configuration/keymap

[[manager.prepend_keymap]]
on   = [ "<Esc>" ]
run  = "escape"
desc = "Exit visual mode, clear selected, or cancel search"

[[manager.prepend_keymap]]
on   = [ "q" ]
run  = "quit"
desc = "Exit the process"

[[manager.prepend_keymap]]
on   = [ "Q" ]
run  = "quit --no-cwd-file"
desc = "Exit without writing cwd"

[[manager.prepend_keymap]]
on   = [ "<C-q>" ]
run  = "close"
desc = "Close current tab"

# ============================================================================
# Navigation (Vim-style)
# ============================================================================

[[manager.prepend_keymap]]
on   = [ "k" ]
run  = "arrow -1"
desc = "Move up"

[[manager.prepend_keymap]]
on   = [ "j" ]
run  = "arrow 1"
desc = "Move down"

[[manager.prepend_keymap]]
on   = [ "K" ]
run  = "arrow -5"
desc = "Move up 5"

[[manager.prepend_keymap]]
on   = [ "J" ]
run  = "arrow 5"
desc = "Move down 5"

[[manager.prepend_keymap]]
on   = [ "<C-u>" ]
run  = "arrow -50%"
desc = "Half page up"

[[manager.prepend_keymap]]
on   = [ "<C-d>" ]
run  = "arrow 50%"
desc = "Half page down"

[[manager.prepend_keymap]]
on   = [ "<C-b>" ]
run  = "arrow -100%"
desc = "Page up"

[[manager.prepend_keymap]]
on   = [ "<C-f>" ]
run  = "arrow 100%"
desc = "Page down"

[[manager.prepend_keymap]]
on   = [ "h" ]
run  = "leave"
desc = "Go to parent directory"

[[manager.prepend_keymap]]
on   = [ "l" ]
run  = "enter"
desc = "Enter directory"

[[manager.prepend_keymap]]
on   = [ "<Enter>" ]
run  = "open"
desc = "Open file"

[[manager.prepend_keymap]]
on   = [ "<C-Enter>" ]
run  = "open --interactive"
desc = "Open interactively"

[[manager.prepend_keymap]]
on   = [ "H" ]
run  = "back"
desc = "Go back in history"

[[manager.prepend_keymap]]
on   = [ "L" ]
run  = "forward"
desc = "Go forward in history"

[[manager.prepend_keymap]]
on   = [ "g", "g" ]
run  = "arrow -99999999"
desc = "Go to top"

[[manager.prepend_keymap]]
on   = [ "G" ]
run  = "arrow 99999999"
desc = "Go to bottom"

# ============================================================================
# Selection
# ============================================================================

[[manager.prepend_keymap]]
on   = [ "<Space>" ]
run  = [ "select --state=none", "arrow 1" ]
desc = "Toggle selection and move down"

[[manager.prepend_keymap]]
on   = [ "v" ]
run  = "visual_mode"
desc = "Enter visual mode (selection)"

[[manager.prepend_keymap]]
on   = [ "V" ]
run  = "visual_mode --unset"
desc = "Enter visual mode (unselect)"

[[manager.prepend_keymap]]
on   = [ "<C-a>" ]
run  = "select_all --state=true"
desc = "Select all"

[[manager.prepend_keymap]]
on   = [ "<C-r>" ]
run  = "select_all --state=none"
desc = "Inverse selection"

# ============================================================================
# Operations
# ============================================================================

[[manager.prepend_keymap]]
on   = [ "o" ]
run  = "open"
desc = "Open file"

[[manager.prepend_keymap]]
on   = [ "O" ]
run  = "open --interactive"
desc = "Open interactively"

[[manager.prepend_keymap]]
on   = [ "y" ]
run  = "yank"
desc = "Yank (copy)"

[[manager.prepend_keymap]]
on   = [ "x" ]
run  = "yank --cut"
desc = "Cut"

[[manager.prepend_keymap]]
on   = [ "p" ]
run  = "paste"
desc = "Paste"

[[manager.prepend_keymap]]
on   = [ "P" ]
run  = "paste --force"
desc = "Paste (overwrite)"

[[manager.prepend_keymap]]
on   = [ "-" ]
run  = "link"
desc = "Create symlink (absolute)"

[[manager.prepend_keymap]]
on   = [ "_" ]
run  = "link --relative"
desc = "Create symlink (relative)"

[[manager.prepend_keymap]]
on   = [ "d", "d" ]
run  = "remove"
desc = "Move to trash"

[[manager.prepend_keymap]]
on   = [ "D" ]
run  = "remove --permanently"
desc = "Delete permanently"

[[manager.prepend_keymap]]
on   = [ "a" ]
run  = "create"
desc = "Create file/directory"

[[manager.prepend_keymap]]
on   = [ "r" ]
run  = "rename --cursor=before_ext"
desc = "Rename"

[[manager.prepend_keymap]]
on   = [ ";" ]
run  = "shell --interactive"
desc = "Run shell command"

[[manager.prepend_keymap]]
on   = [ ":" ]
run  = "shell --block --interactive"
desc = "Run shell command (block)"

[[manager.prepend_keymap]]
on   = [ "." ]
run  = "hidden toggle"
desc = "Toggle hidden files"

[[manager.prepend_keymap]]
on   = [ "s" ]
run  = "search fd"
desc = "Search with fd"

[[manager.prepend_keymap]]
on   = [ "S" ]
run  = "search rg"
desc = "Search with ripgrep"

[[manager.prepend_keymap]]
on   = [ "<C-s>" ]
run  = "search none"
desc = "Cancel search"

# ============================================================================
# Filtering and Sorting
# ============================================================================

[[manager.prepend_keymap]]
on   = [ "f" ]
run  = "filter --smart"
desc = "Filter files"

[[manager.prepend_keymap]]
on   = [ "/" ]
run  = "find --smart"
desc = "Find next"

[[manager.prepend_keymap]]
on   = [ "?" ]
run  = "find --previous --smart"
desc = "Find previous"

[[manager.prepend_keymap]]
on   = [ "n" ]
run  = "find_arrow"
desc = "Go to next found"

[[manager.prepend_keymap]]
on   = [ "N" ]
run  = "find_arrow --previous"
desc = "Go to previous found"

# ============================================================================
# Sorting
# ============================================================================

[[manager.prepend_keymap]]
on   = [ ",", "m" ]
run  = "sort modified --dir-first"
desc = "Sort by modified time"

[[manager.prepend_keymap]]
on   = [ ",", "M" ]
run  = "sort modified --reverse --dir-first"
desc = "Sort by modified time (reverse)"

[[manager.prepend_keymap]]
on   = [ ",", "c" ]
run  = "sort created --dir-first"
desc = "Sort by created time"

[[manager.prepend_keymap]]
on   = [ ",", "C" ]
run  = "sort created --reverse --dir-first"
desc = "Sort by created time (reverse)"

[[manager.prepend_keymap]]
on   = [ ",", "e" ]
run  = "sort extension --dir-first"
desc = "Sort by extension"

[[manager.prepend_keymap]]
on   = [ ",", "E" ]
run  = "sort extension --reverse --dir-first"
desc = "Sort by extension (reverse)"

[[manager.prepend_keymap]]
on   = [ ",", "a" ]
run  = "sort alphabetical --dir-first"
desc = "Sort alphabetically"

[[manager.prepend_keymap]]
on   = [ ",", "A" ]
run  = "sort alphabetical --reverse --dir-first"
desc = "Sort alphabetically (reverse)"

[[manager.prepend_keymap]]
on   = [ ",", "n" ]
run  = "sort natural --dir-first"
desc = "Sort naturally"

[[manager.prepend_keymap]]
on   = [ ",", "N" ]
run  = "sort natural --reverse --dir-first"
desc = "Sort naturally (reverse)"

[[manager.prepend_keymap]]
on   = [ ",", "s" ]
run  = "sort size --dir-first"
desc = "Sort by size"

[[manager.prepend_keymap]]
on   = [ ",", "S" ]
run  = "sort size --reverse --dir-first"
desc = "Sort by size (reverse)"

# ============================================================================
# Tabs
# ============================================================================

[[manager.prepend_keymap]]
on   = [ "t" ]
run  = "tab_create --current"
desc = "Create new tab"

[[manager.prepend_keymap]]
on   = [ "1" ]
run  = "tab_switch 0"
desc = "Switch to tab 1"

[[manager.prepend_keymap]]
on   = [ "2" ]
run  = "tab_switch 1"
desc = "Switch to tab 2"

[[manager.prepend_keymap]]
on   = [ "3" ]
run  = "tab_switch 2"
desc = "Switch to tab 3"

[[manager.prepend_keymap]]
on   = [ "4" ]
run  = "tab_switch 3"
desc = "Switch to tab 4"

[[manager.prepend_keymap]]
on   = [ "[" ]
run  = "tab_switch -1 --relative"
desc = "Previous tab"

[[manager.prepend_keymap]]
on   = [ "]" ]
run  = "tab_switch 1 --relative"
desc = "Next tab"

[[manager.prepend_keymap]]
on   = [ "{" ]
run  = "tab_swap -1"
desc = "Swap with previous tab"

[[manager.prepend_keymap]]
on   = [ "}" ]
run  = "tab_swap 1"
desc = "Swap with next tab"

# ============================================================================
# Goto shortcuts (g prefix)
# ============================================================================

[[manager.prepend_keymap]]
on   = [ "g", "h" ]
run  = "cd ~"
desc = "Go to home"

[[manager.prepend_keymap]]
on   = [ "g", "c" ]
run  = "cd ~/.config"
desc = "Go to ~/.config"

[[manager.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Downloads"
desc = "Go to downloads"

[[manager.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Documents"
desc = "Go to documents"

[[manager.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/projects"
desc = "Go to projects"

[[manager.prepend_keymap]]
on   = [ "g", "." ]
run  = "cd ~/.dotfiles"
desc = "Go to dotfiles"

[[manager.prepend_keymap]]
on   = [ "g", "t" ]
run  = "cd ~/.local/share/Trash"
desc = "Go to trash"

[[manager.prepend_keymap]]
on   = [ "g", "/" ]
run  = "cd /"
desc = "Go to root"

# ============================================================================
# Copy (yank) to clipboard
# ============================================================================

[[manager.prepend_keymap]]
on   = [ "c", "c" ]
run  = "copy path"
desc = "Copy file path"

[[manager.prepend_keymap]]
on   = [ "c", "d" ]
run  = "copy dirname"
desc = "Copy directory path"

[[manager.prepend_keymap]]
on   = [ "c", "f" ]
run  = "copy filename"
desc = "Copy filename"

[[manager.prepend_keymap]]
on   = [ "c", "n" ]
run  = "copy name_without_ext"
desc = "Copy filename without extension"

# ============================================================================
# FZF Integration
# ============================================================================

[[manager.prepend_keymap]]
on   = [ "<C-f>" ]
run  = "plugin fzf"
desc = "FZF jump"

# ============================================================================
# Zoxide Integration (smart cd)
# ============================================================================

[[manager.prepend_keymap]]
on   = [ "z" ]
run  = "plugin zoxide"
desc = "Jump with zoxide"

[[manager.prepend_keymap]]
on   = [ "Z" ]
run  = "plugin fzf"
desc = "Jump with fzf"

# ============================================================================
# Help
# ============================================================================

[[manager.prepend_keymap]]
on   = [ "~" ]
run  = "help"
desc = "Open help"
