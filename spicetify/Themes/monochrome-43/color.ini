; Monochrome 43 - Spotify (Spicetify) colour scheme.
;
; After 43PR/dotfiles (MIT), which runs Spicetify's "text" theme with its
; Monochrome scheme; this is the same idea built from
; .config/palette/monochrome-43.conf. Spicetify wants bare hex (no '#');
; test_palette.bats checks every value is a palette colour.

[Monochrome]
text               = ffffff
subtext            = 8b93a7
main               = 000000
main-elevated      = 0d0d0d
highlight          = 161616
highlight-elevated = 2a2a2a
sidebar            = 000000
player             = 050505
card               = 0d0d0d
shadow             = 000000
selected-row       = ffffff
button             = ffffff
button-active      = ffffff
button-disabled    = 4a4a4a
tab-active         = 2a2a2a
notification       = 2a2a2a
notification-error = ff003c
misc               = 6f6f6f
