name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: BATS Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install BATS and libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bats-core
          brew tap bats-core/bats-core
          brew install bats-support bats-assert

      - name: Install BATS and libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          # Install bats-support and bats-assert
          sudo mkdir -p /usr/lib/bats
          sudo git clone https://github.com/bats-core/bats-support.git /usr/lib/bats/bats-support
          sudo git clone https://github.com/bats-core/bats-assert.git /usr/lib/bats/bats-assert

      - name: Run test suite
        run: make test

  go-cli:
    name: Go CLI Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        go: ['1.22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Build CLI
        working-directory: cmd/dotfiles
        run: |
          go mod download
          go build -v -o dotfiles-cli .

      - name: Test CLI help
        working-directory: cmd/dotfiles
        run: ./dotfiles-cli --help

      - name: Test CLI version detection
        working-directory: cmd/dotfiles
        run: ./dotfiles-cli install --help

  integration:
    name: Integration Tests
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install stow
        run: brew install stow

      - name: Test symlink creation
        run: |
          make link
          test -L "$HOME/.zshenv"
          test -d "$HOME/.config"

      - name: Test symlink removal
        run: |
          make unlink
          test ! -L "$HOME/.zshenv"

      - name: Test clean target
        run: make clean

  nix-check:
    name: Nix Flake Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check --no-build
        continue-on-error: true

      - name: Show flake info
        run: nix flake show
