# Starship prompt — danse palette (.config/palette/), replicating the repo's lean Powerlevel10k
# layout: `user@host dir git duration` on line 1, `venv ❯` on line 2.
# Initialised from .config/zsh/.zshrc.
"$schema" = 'https://starship.rs/config-schema.json'

# Colour names below are the [palettes.danse] table at the end of this file,
# which is rendered from the palette; styles name roles, never hexes.
palette = 'danse'

# Blank line between prompts, like POWERLEVEL9K_PROMPT_ADD_NEWLINE.
add_newline = true

format = """
$username$hostname$directory$git_branch$git_status$cmd_duration
$python$character"""

# user@host only over SSH or as root, matching p10k's lean context segment.
[username]
format = '[$user]($style)[@](fg:comment)'
style_user = 'yellow'
style_root = 'bold vermilion'

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = 'yellow'

[directory]
style = 'blue'
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = '[$branch]($style) '
style = 'green'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'yellow'

# Show duration of commands slower than 3s (p10k's default threshold).
[cmd_duration]
min_time = 3000
format = '[$duration]($style) '
style = 'terracotta'

# Active virtualenv only (no interpreter version noise), like p10k's
# virtualenv segment on line 2.
[python]
format = '[(\($virtualenv\) )]($style)'
style = 'cyan'
detect_extensions = []
detect_files = []
detect_folders = []

[character]
success_symbol = '[❯](magenta)'
error_symbol = '[❯](vermilion)'

# palette:begin - rendered from .config/palette/templates/.config/starship/starship.toml; edit it there, then run bin/palette render
[palettes.danse]
comment = '#5c6370'
yellow = '#e5c07b'
vermilion = '#e06a51'
blue = '#61afef'
green = '#98c379'
terracotta = '#d98c5c'
cyan = '#56b6c2'
magenta = '#c678dd'
# palette:end
