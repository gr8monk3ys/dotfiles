# monochrome-43 - the "Monochrome 43" rice: pure black ground, white text,
# greys for structure, colour only where it carries meaning.
#
# Taken from 43PR/dotfiles (MIT, github.com/43PR/dotfiles), its default theme
# .config/43pr/themes/default.toml, which is the look the rice is modelled
# on. Two departures, both from the Omarchy theme built on it
# (omarchy/themes/monochrome-43): `surface` is the selection colour (43PR's
# lemon selection does not survive a black-and-white desktop), and
# `inactive` is the unfocused-window border on macOS.
#
# Format: name|hex|role. Read with `PALETTE=monochrome-43 palette ...`;
# never re-typed by hand. danse.conf stays the default palette; this one
# feeds the opt-in Monochrome 43 variants and the Omarchy theme.

bg|#000000|ground - terminal, bar, every surface
bg-panel|#050505|panel ground - one step off black
bg-card|#0d0d0d|card / raised panel
bg-track|#161616|meter and slider track
border|#151515|hairline between panels
surface|#2a2a2a|selection, active chrome fill
inactive|#333333|unfocused window border
fg|#ffffff|primary text, focused border, accent
fg-soft|#e6eaf2|secondary text
fg-dim|#c2c2c2|tertiary text
fg-muted|#8b93a7|labels
fg-dark|#6f6f6f|dim text, comments
fg-faint|#4a4a4a|disabled text, faint rules
cursor|#cccccc|terminal cursor
cursor-text|#111111|text under the terminal cursor
highlight|#7aa2f7|the one cool accent - links, info
danger|#ff003c|error
urgent|#f7768e|warning, urgency
ok|#00ff9c|success
ansi-1|#cc0403|ANSI red
ansi-2|#e2e2e2|ANSI green - deliberately grey, git noise stays quiet
ansi-3|#cecb00|ANSI yellow
ansi-4|#0d73cc|ANSI blue
ansi-5|#cb1ed1|ANSI magenta
ansi-6|#0dcdcd|ANSI cyan
ansi-7|#dddddd|ANSI white
ansi-8|#767676|ANSI bright black
ansi-9|#f2201f|ANSI bright red
ansi-10|#23fd00|ANSI bright green
ansi-11|#fffd00|ANSI bright yellow
ansi-12|#1a8fff|ANSI bright blue
ansi-13|#fd28ff|ANSI bright magenta
ansi-14|#14ffff|ANSI bright cyan
