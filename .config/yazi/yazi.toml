# Yazi File Manager Configuration
# https://yazi-rs.github.io/docs/configuration/yazi

[manager]
# Show hidden files by default
show_hidden = true
# Sort directories first
sort_dir_first = true
# Sort by natural order (1, 2, 10 instead of 1, 10, 2)
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
# Line mode shows file info
linemode = "size"
# Show symlink targets
show_symlink = true

[preview]
# Tab width for code preview
tab_size = 2
# Max file size for preview (50MB)
max_width = 1200
max_height = 900
# Image preview settings
image_filter = "triangle"
image_quality = 75
# Use sixel for image preview in supported terminals
sixel_fraction = 15

[opener]
# Define how to open files
edit = [
    { run = '${EDITOR:-nvim} "$@"', desc = "Edit with $EDITOR", block = true }
]
open = [
    { run = 'xdg-open "$@"', desc = "Open", for = "linux" },
    { run = 'open "$@"', desc = "Open", for = "macos" }
]
reveal = [
    { run = 'open -R "$@"', desc = "Reveal in Finder", for = "macos" },
    { run = 'nautilus --select "$@"', desc = "Reveal in Files", for = "linux" }
]
extract = [
    { run = 'ouch decompress "$@"', desc = "Extract with ouch" }
]
archive = [
    { run = 'ouch compress "$@" "${1}.tar.gz"', desc = "Compress with ouch" }
]

[open]
rules = [
    # Folders - enter them
    { name = "*/", use = [ "edit", "open", "reveal" ] },

    # Text files
    { mime = "text/*", use = [ "edit", "reveal" ] },
    { mime = "application/json", use = [ "edit", "reveal" ] },
    { mime = "application/x-yaml", use = [ "edit", "reveal" ] },
    { mime = "application/toml", use = [ "edit", "reveal" ] },
    { mime = "application/xml", use = [ "edit", "reveal" ] },
    { mime = "application/javascript", use = [ "edit", "reveal" ] },
    { mime = "application/x-sh", use = [ "edit", "reveal" ] },

    # Archives - extract
    { mime = "application/zip", use = [ "extract", "reveal" ] },
    { mime = "application/gzip", use = [ "extract", "reveal" ] },
    { mime = "application/x-tar", use = [ "extract", "reveal" ] },
    { mime = "application/x-bzip2", use = [ "extract", "reveal" ] },
    { mime = "application/x-7z-compressed", use = [ "extract", "reveal" ] },
    { mime = "application/x-rar", use = [ "extract", "reveal" ] },
    { mime = "application/x-xz", use = [ "extract", "reveal" ] },
    { mime = "application/zstd", use = [ "extract", "reveal" ] },

    # Images
    { mime = "image/*", use = [ "open", "reveal" ] },

    # Videos
    { mime = "video/*", use = [ "open", "reveal" ] },

    # Audio
    { mime = "audio/*", use = [ "open", "reveal" ] },

    # PDFs
    { mime = "application/pdf", use = [ "open", "reveal" ] },

    # Fallback
    { name = "*", use = [ "open", "reveal" ] }
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912  # 512MB for image cache
image_bound = [0, 0]

[plugin]
preloaders = [
    # Images
    { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
    { mime = "image/*", run = "image" },
    # Videos
    { mime = "video/*", run = "video" },
    # PDFs
    { mime = "application/pdf", run = "pdf" },
]
previewers = [
    { name = "*/", run = "folder", sync = true },
    # Code/Text with syntax highlighting (via bat)
    { mime = "text/*", run = "code" },
    { mime = "*/xml", run = "code" },
    { mime = "*/json", run = "code" },
    { mime = "*/javascript", run = "code" },
    { mime = "*/x-yaml", run = "code" },
    { mime = "*/toml", run = "code" },
    # Images
    { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
    { mime = "image/*", run = "image" },
    # Videos
    { mime = "video/*", run = "video" },
    # PDFs
    { mime = "application/pdf", run = "pdf" },
    # Archives
    { mime = "application/zip", run = "archive" },
    { mime = "application/gzip", run = "archive" },
    { mime = "application/x-tar", run = "archive" },
    { mime = "application/x-bzip2", run = "archive" },
    { mime = "application/x-7z-compressed", run = "archive" },
    { mime = "application/x-rar", run = "archive" },
    { mime = "application/x-xz", run = "archive" },
    # Fallback
    { name = "*", run = "file" }
]

[input]
# Cursor settings for input prompts
cursor_blink = true

[select]
# Selection menu settings
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]
