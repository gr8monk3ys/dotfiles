# GlazeWM - tiling for Windows, laid out like Omarchy.
#
# Bindings follow Omarchy's Hyprland defaults (Super = the Windows key) so the
# same hands work on both. Colours are .config/palette/danse.conf; every hex in
# this file must be a palette colour, which test_palette.bats asserts. Gaps and
# borders mirror aerospace.toml and borders/bordersrc on macOS.
#
# Started by windows/setup.ps1 with `glazewm start --config <this file>`, so
# edits here take effect on Super+Shift+Alt+R with nothing copied around.
# Schema: https://github.com/glzr-io/glazewm (resources/assets/sample-config.yaml)

general:
  # Zebar draws the top bar; it is started and stopped with the WM so the two
  # never disagree about whether tiling is on.
  startup_commands: ['shell-exec zebar']
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  # top clears the 32px Zebar bar plus the same 8px of air as the other edges.
  outer_gap:
    top: '40px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#61afef' # blue - focus, as in borders/bordersrc
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: true
      color: '#3e4451' # surface - inactive border
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '95%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  - commands: ['ignore']
    match:
      # The bar itself.
      - window_process: { equals: 'zebar' }
      # Browser picture-in-picture.
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      # PowerToys overlays and the Command Palette launcher (Super+Alt+Space).
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      # Office child windows (dialogs, not documents).
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

  # Small utility windows read better floating, as Omarchy floats them.
  - commands: ['set-floating --centered']
    match:
      - window_process: { equals: 'Taskmgr' }
      - window_process: { equals: 'SystemSettings' }
      - window_class: { equals: 'OperationStatusWindow' } # Explorer copy/move progress
      - window_process: { equals: 'Calculator' }
      - window_process: { equals: 'loopMIDI' }

# No resize binding mode: Super +/- covers it, and the mode's usual key
# (Win+R) is Windows' Run dialog.
binding_modes: []

keybindings:
  # --- apps (Omarchy: Super+Return terminal, Super+Shift+B browser,
  # Super+Shift+F files). The launcher, Super+Alt+Space, is PowerToys Command
  # Palette's own default hotkey, so nothing here may bind lwin+alt+space:
  # GlazeWM's keyboard hook would swallow it before the launcher sees it.
  - commands: ['shell-exec wt -w new -p Arch']
    bindings: ['lwin+enter']
  - commands: ['shell-exec brave']
    bindings: ['lwin+shift+b']
  - commands: ['shell-exec explorer']
    bindings: ['lwin+shift+f']

  # --- windows
  - commands: ['close']
    bindings: ['lwin+w']
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+t']
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+f']
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+j']
  - commands: ['focus --direction left']
    bindings: ['lwin+left']
  - commands: ['focus --direction right']
    bindings: ['lwin+right']
  - commands: ['focus --direction up']
    bindings: ['lwin+up']
  - commands: ['focus --direction down']
    bindings: ['lwin+down']
  - commands: ['move --direction left']
    bindings: ['lwin+shift+left']
  - commands: ['move --direction right']
    bindings: ['lwin+shift+right']
  - commands: ['move --direction up']
    bindings: ['lwin+shift+up']
  - commands: ['move --direction down']
    bindings: ['lwin+shift+down']

  # --- resize (Omarchy: Super +/- width, with Shift for height)
  - commands: ['resize --width -100px']
    bindings: ['lwin+oem_minus']
  - commands: ['resize --width +100px']
    bindings: ['lwin+oem_plus']
  - commands: ['resize --height -100px']
    bindings: ['lwin+shift+oem_minus']
  - commands: ['resize --height +100px']
    bindings: ['lwin+shift+oem_plus']

  # --- workspaces
  - commands: ['focus --next-active-workspace']
    bindings: ['lwin+tab']
  - commands: ['focus --prev-active-workspace']
    bindings: ['lwin+shift+tab']
  - commands: ['focus --recent-workspace']
    bindings: ['lwin+ctrl+tab']
  - commands: ['move-workspace --direction left']
    bindings: ['lwin+shift+alt+left']
  - commands: ['move-workspace --direction right']
    bindings: ['lwin+shift+alt+right']
  - commands: ['focus --workspace 1']
    bindings: ['lwin+1']
  - commands: ['focus --workspace 2']
    bindings: ['lwin+2']
  - commands: ['focus --workspace 3']
    bindings: ['lwin+3']
  - commands: ['focus --workspace 4']
    bindings: ['lwin+4']
  - commands: ['focus --workspace 5']
    bindings: ['lwin+5']
  - commands: ['focus --workspace 6']
    bindings: ['lwin+6']
  - commands: ['focus --workspace 7']
    bindings: ['lwin+7']
  - commands: ['focus --workspace 8']
    bindings: ['lwin+8']
  - commands: ['focus --workspace 9']
    bindings: ['lwin+9']
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['lwin+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['lwin+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['lwin+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['lwin+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['lwin+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['lwin+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['lwin+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['lwin+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['lwin+shift+9']

  # --- the WM itself
  - commands: ['wm-reload-config']
    bindings: ['lwin+shift+alt+r']
  # Pause before playing a game: tiling and every binding above stop until
  # pressed again (Zebar shows PAUSED).
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+shift+alt+p']
  - commands: ['wm-exit']
    bindings: ['lwin+shift+alt+e']
