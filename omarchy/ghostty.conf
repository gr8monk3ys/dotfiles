# Ghostty settings for Omarchy only, included from ~/.config/ghostty/config.local.
#
# The shared .config/ghostty/config replaces the one Omarchy ships, which is
# fine on macOS and loses a few things that matter on Linux. omarchy/setup.sh
# (step `ghostty`) adds one line to the gitignored config.local:
#   config-file = <this checkout>/omarchy/ghostty.conf
# so these apply only on the Omarchy box, never on the Mac. Ghostty loads an
# included file after the file that includes it, so this wins over the
# shared config and over the rest of config.local.

# zsh in every terminal, without changing the login shell: OPERATING.md says
# not to chsh on Omarchy, whose own scripts assume bash. The shared config's
# `shell-integration = zsh` still applies. If zsh is ever uninstalled, delete
# the include line from config.local or Ghostty cannot start a shell.
command = /usr/bin/zsh

# Omarchy's font size. The shared 15 is tuned for a Retina Mac and is huge
# under Hyprland's scaling.
font-size = 9

# From Omarchy's ghostty config: SSH terminfo, and copy/paste on the keys
# Omarchy's universal super+c / super+v send to terminals.
shell-integration-features = cursor,sudo,title,ssh-env
keybind = shift+insert=paste_from_clipboard
keybind = control+insert=copy_to_clipboard
# Shift+Enter and Alt+Shift+Enter as CSI-u, so TUIs (and tmux) can tell them
# apart from Enter / Alt+Enter.
keybind = shift+enter=csi:13;2u
keybind = alt+shift+enter=csi:13;4u
keybind = super+control+shift+alt+arrow_down=resize_split:down,100
keybind = super+control+shift+alt+arrow_up=resize_split:up,100
keybind = super+control+shift+alt+arrow_left=resize_split:left,100
keybind = super+control+shift+alt+arrow_right=resize_split:right,100

# GTK chrome as Omarchy has it.
window-theme = ghostty
gtk-toolbar-style = flat
mouse-scroll-multiplier = 0.95

# Omarchy's fix for general slowness under Hyprland
# (https://github.com/ghostty-org/ghostty/discussions/3224). Linux-only.
async-backend = epoll
