# field-notebook - the "Field Notebook" rice: lscaturchio.xyz at night.
# Night paper, one forest-green pen, sand-quiet hairlines. Tokens from the
# site's DESIGN.md (night mode); ANSI status colours softened so none shouts.
#
# Format: name|hex|role. Read with `PALETTE=field-notebook palette ...`.
# The Omarchy theme (omarchy/rices/field-notebook/theme/colors.toml) and the
# wallpaper renderer use only these colours (checked by test_palette.bats).

bg|#111317|night - the ground everything sits on
bg-dark|#0d0f12|frame, one step below night
bg-darker|#0a0b0d|vignette and window shadow
bg-card|#16181d|night-card, raised panel
border|#292c32|inactive window border
selection|#1c342c|pen at 22% over night: text selection
selection-red|#3b2a2d|signal-error at 22% over night: removed lines in a diff
fg|#eceef1|primary text
fg-light|#d5d8de|secondary text
fg-muted|#abb0ba|night-ink-muted
fg-bright|#fafafa|night-ink, selected text
fg-faint|#767c87|ink-faint: labels, wall text
pen|#42a979|forest-ink: the one accent, focused border
pen-deep|#397f5e|focused border gradient end
red|#e87c7c|signal-error
yellow|#e3b25e|signal-warning
orange|#e08d55|ansi orange
blue|#7aa0e6|signal-info
magenta|#b796c8|ansi magenta
cyan|#5fb3a1|between moss and info
brown|#a07d5a|paper-warm at night
bright-red|#f09a9a|ansi bright red
bright-green|#5fc493|ansi bright green
bright-yellow|#efc883|ansi bright yellow
bright-blue|#9bb9ef|ansi bright blue
bright-magenta|#ccb1da|ansi bright magenta
bright-cyan|#83cbbb|ansi bright cyan
