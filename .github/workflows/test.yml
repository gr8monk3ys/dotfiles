name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: BATS Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install BATS and libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bats-core
          brew tap bats-core/bats-core
          brew install bats-support bats-assert

      - name: Install BATS and libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          # Install bats-support and bats-assert
          sudo mkdir -p /usr/lib/bats
          sudo git clone https://github.com/bats-core/bats-support.git /usr/lib/bats/bats-support
          sudo git clone https://github.com/bats-core/bats-assert.git /usr/lib/bats/bats-assert

      - name: Run platform detection tests
        run: bats test/test_platform.bats

      - name: Run bin script tests
        run: bats test/test_bin_scripts.bats

      - name: Run package validation tests
        run: bats test/test_packages.bats

  integration:
    name: Integration Tests
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install stow
        run: brew install stow

      - name: Test symlink creation
        run: |
          make link
          test -L "$HOME/.zshenv"
          test -d "$HOME/.config"

      - name: Test symlink removal
        run: |
          make unlink
          test ! -L "$HOME/.zshenv"

      - name: Test clean target
        run: make clean
